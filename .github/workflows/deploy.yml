# main に push されるたびに、テスト → ビルド → GitHub Pages へ自動デプロイする
#
# 方式: ビルド結果を gh-pages ブランチに push する。
# gh-pages ブランチが作られると GitHub Pages は自動で有効になるため、
# リポジトリ設定を手で触る必要がない（GITHUB_TOKEN には Pages サイトを
# 新規作成する権限がないので、actions/deploy-pages 方式は初回に失敗する）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh-pages ブランチへの push
  pages: write # Pages のビルド要求

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # vite.config.ts が GITHUB_REPOSITORY からリポジトリ名を読み取り、
        # https://<owner>.github.io/<repo>/ 用の base を自動設定する
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      # 初回は gh-pages ブランチの作成で Pages が有効化されるだけで
      # ビルドが走らないことがあるため、明示的にビルドを要求する
      - name: Request Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request skipped"

      # Pages 側のビルドが終わるまで待ち、結果（と失敗時の理由）をログに出す
      - name: Wait for Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Pages site ---"
          gh api "repos/${GITHUB_REPOSITORY}/pages" || echo "(pages info unavailable)"
          for i in $(seq 1 30); do
            sleep 10
            json=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')
            status=$(echo "$json" | jq -r '.status // "unknown"')
            echo "[$i] status=$status"
            if [ "$status" = "built" ]; then
              echo "✅ Pages build finished"
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "❌ Pages build failed:"
              echo "$json" | jq '.error'
              exit 1
            fi
          done
          echo "⚠️ Pages build did not finish in time (status=$status)"
          echo "$json"

      - name: Show URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          echo "### 🚀 Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${owner,,}.github.io/${repo}/" >> "$GITHUB_STEP_SUMMARY"
