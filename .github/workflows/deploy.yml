# main に push されるたびに、テスト → ビルド → GitHub Pages へ自動デプロイする
#
# GitHub Pages の「Source」設定がどちらでも動くようにしている:
#   - GitHub Actions          → actions/deploy-pages でデプロイ（推奨）
#   - Deploy from a branch    → gh-pages ブランチに push してデプロイ
# Pages がまだ有効になっていない場合は、gh-pages ブランチを用意したうえで
# 有効化の手順をログに出して失敗する（GITHUB_TOKEN には Pages サイトを
# 新規作成する権限がないため、初回の有効化だけはリポジトリ設定で行う）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh-pages ブランチへの push
  pages: write # Pages へのデプロイ／ビルド要求
  id-token: write # actions/deploy-pages に必要

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # vite.config.ts が GITHUB_REPOSITORY からリポジトリ名を読み取り、
        # https://<owner>.github.io/<repo>/ 用の base を自動設定する
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Detect Pages mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          json=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null || echo '{}')
          build_type=$(echo "$json" | jq -r '.build_type // empty')
          case "$build_type" in
            workflow) mode=workflow ;;
            legacy)   mode=branch ;;
            *)        mode=disabled ;;
          esac
          echo "Pages build_type=${build_type:-<none>} → mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # --- Source: GitHub Actions の場合 ---
      - name: Upload Pages artifact
        if: steps.mode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # --- Source: Deploy from a branch の場合（未設定時も、選べるように用意しておく） ---
      - name: Publish to gh-pages branch
        if: steps.mode.outputs.mode != 'workflow'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      - name: Wait for Pages build (branch mode)
        if: steps.mode.outputs.mode == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
          for i in $(seq 1 30); do
            sleep 10
            json=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')
            status=$(echo "$json" | jq -r '.status // "unknown"')
            echo "[$i] status=$status"
            [ "$status" = "built" ] && { echo "✅ Pages build finished"; exit 0; }
            if [ "$status" = "errored" ]; then
              echo "❌ Pages build failed:"; echo "$json" | jq '.error'; exit 1
            fi
          done
          echo "⚠️ Pages build did not finish in time (status=$status)"

      - name: Pages is not enabled yet
        if: steps.mode.outputs.mode == 'disabled'
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY##*/}"
          {
            echo "## ⚠️ GitHub Pages がまだ有効になっていません"
            echo
            echo "ビルドは成功し、\`gh-pages\` ブランチも更新済みです。初回だけ次の設定をしてください（1回きり）。"
            echo
            echo "1. リポジトリの **Settings → Pages** を開く: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
            echo "2. **Build and deployment → Source** で **GitHub Actions** を選ぶ"
            echo "   （または **Deploy from a branch** → Branch: \`gh-pages\` / \`/ (root)\` → Save）"
            echo "3. このワークフローを再実行するか、main に push する"
            echo
            echo "公開 URL: https://${owner,,}.github.io/${repo}/"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages が未設定です。Settings → Pages → Source を設定してください（詳細はジョブのサマリー参照）"
          exit 1

      - name: Show URL
        if: steps.mode.outputs.mode == 'branch'
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY##*/}"
          echo "### 🚀 Deployed (branch mode)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${owner,,}.github.io/${repo}/" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (GitHub Actions mode)
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
