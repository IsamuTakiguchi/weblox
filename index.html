<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1420" />
    <meta name="description" content="Weblox - こどもでもかんたんにゲームがつくれる、あそべる、こうかいできるゲームプラットフォーム" />
    <title>Weblox</title>

    <!-- ホーム画面に追加したときのアイコン・名前（Android / iOS） -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="application-name" content="Weblox" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Weblox" />
    <!-- ステータスバーは不透明にして、ホーム画面から開いたときに画面の上が時計やノッチの下に隠れないようにする -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SNS などでリンクを共有したときの表示 -->
    <meta property="og:title" content="Weblox" />
    <meta property="og:description" content="あそぶ・つくる・みんなにみせる。5さいからゲームがつくれる Roblox 風プラットフォーム" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
